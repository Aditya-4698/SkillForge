{% extends "base.html" %}


{% block title %}

SkillForge - Edit Skill

{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-body p-4">

                <h3>
                    Edit Skill
                </h3>

                <p class="text-muted">
                    Update your skill information.
                </p>


                <form method="POST">

                    {% csrf_token %}


                    {{ form.as_p }}


                    <button
                        type="submit"
                        class="btn btn-dark">

                        Update Skill

                    </button>


                    <a
                        href="{% url 'skills_home' %}"
                        class="btn btn-outline-secondary ms-2">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
