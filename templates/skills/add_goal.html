{% extends "base.html" %}


{% block title %}

Add Goal - SkillForge

{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-body p-4">

                <h3>
                    Add Learning Goal
                </h3>

                <p class="text-muted">

                    Create a goal for

                    <strong>
                        {{ skill.name }}
                    </strong>

                </p>


                <form method="POST">

                    {% csrf_token %}


                    {{ form.as_p }}


                    <button
                        type="submit"
                        class="btn btn-dark">

                        Save Goal

                    </button>


                    <a
                        href="{% url 'skill_detail' skill.id %}"
                        class="btn btn-outline-secondary ms-2">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
