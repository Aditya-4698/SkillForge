{% extends "base.html" %}

{% block title %}
Edit Task - SkillForge
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-body p-4">
                <h3>
                    Edit Task
                </h3>

                <p class="text-muted">
                    Goal:
                    <strong>{{ goal.title }}</strong>
                </p>

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-dark">Save Changes</button>

                    <a href="{% url 'skill_detail' skill.id %}" class="btn btn-outline-secondary ms-2">
                        Cancel
                    </a>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
