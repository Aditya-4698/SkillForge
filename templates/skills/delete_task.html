{% extends "base.html" %}


{% block title %}

Delete Task - SkillForge

{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body text-center p-4">

                <h3>
                    Delete Task?
                </h3>

                <p class="text-muted">

                    Are you sure you want to delete:

                </p>

                <h5>
                    "{{ task.title }}"
                </h5>


                <form method="POST" class="mt-4">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger">

                        Yes, Delete

                    </button>


                    <a
                        href="{% url 'skill_detail' skill.id %}"
                        class="btn btn-outline-secondary ms-2">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
